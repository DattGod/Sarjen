<!DOCTYPE html>
<html>
<head>
<title>Counter Timer</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:100px;
}

#counter{
    font-size:50px;
    margin-bottom:30px;
}

button{
    padding:10px 20px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>
<body>

<h2>Counter Timer</h2>

<div id="counter">0</div>

<button onclick="startCounter()">Start</button>
<button onclick="pauseCounter()">Pause</button>
<button onclick="stopCounter()">Stop</button>

<script>

let count = 0;
let interval = null;

function startCounter(){

    if(interval !== null) return;

    interval = setInterval(function(){

        if(count >= 10){
            clearInterval(interval);
            interval = null;
            return;
        }

        count++;
        document.getElementById("counter").innerHTML = count;

    },1000);
}

function pauseCounter(){
    clearInterval(interval);
    interval = null;
}

function stopCounter(){
    clearInterval(interval);
    interval = null;
    count = 0;
    document.getElementById("counter").innerHTML = count;
}

</script>

</body>
</html>
